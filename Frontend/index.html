<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0a0d14">
    <meta name="description" content="Interactive, simulation-based quantum network slicing operations dashboard">
    <title>QNet Control | Quantum Network Slicing</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <a class="brand" href="#" data-page="overview" aria-label="QNet Control overview">
          <span class="brand-mark"><span></span><span></span><span></span><span></span></span>
          <span><strong>QNET</strong><small>CONTROL PLANE</small></span>
        </a>
        <div class="workspace-label">WORKSPACE</div>
        <nav class="main-nav" aria-label="Main navigation">
          <button class="nav-link active" data-page="overview"><span class="nav-icon">◫</span>Overview</button>
          <button class="nav-link" data-page="topology"><span class="nav-icon">⌘</span>Network topology</button>
          <button class="nav-link" data-page="tenants"><span class="nav-icon">▤</span>Tenant slices <span class="nav-count" id="tenant-count">04</span></button>
          <button class="nav-link" data-page="routing"><span class="nav-icon">↗</span>Adaptive routing</button>
          <button class="nav-link" data-page="resources"><span class="nav-icon">◉</span>Resources</button>
          <button class="nav-link" data-page="events"><span class="nav-icon">ϟ</span>Event monitor <span class="nav-dot"></span></button>
          <button class="nav-link" data-page="analytics"><span class="nav-icon">▥</span>Analytics</button>
          <button class="nav-link" data-page="algorithms"><span class="nav-icon">⌬</span>Algorithm notes</button>
        </nav>
        <div class="sidebar-bottom">
          <div class="plane-card">
            <div class="plane-top"><span class="status-pulse"></span> CONTROL PLANE <span class="plane-live">LIVE</span></div>
            <div class="plane-detail">Deterministic simulation</div>
            <div class="plane-detail mono">SEED <strong>23</strong> <span>·</span> EPOCH <strong id="epoch-label">000</strong></div>
          </div>
          <button class="nav-link" data-action="settings"><span class="nav-icon">⚙</span>Settings</button>
          <div class="user-chip"><span class="avatar">OP</span><span><strong>Network operator</strong><small>Research environment</small></span><span class="more">···</span></div>
        </div>
      </aside>
      <main class="main-area">
        <header class="topbar">
          <div class="breadcrumbs"><button class="mobile-menu" data-action="toggle-sidebar" aria-label="Toggle menu">☰</button><span>QNet Control</span><span class="crumb-slash">/</span><strong id="current-page">Overview</strong></div>
          <div class="topbar-actions">
            <span class="sim-badge"><span class="status-pulse"></span> SIMULATION MODE</span>
            <span class="top-separator"></span>
            <span class="clock mono" id="clock"></span>
            <button class="icon-button" title="Event monitor" data-page="events">ϟ<span class="notification-dot"></span></button>
            <span class="avatar small-avatar">OP</span>
          </div>
        </header>
        <section class="page-content" id="content" aria-live="polite"></section>
      </main>
      <div class="toast-region" id="toast-region" aria-live="polite"></div>
      <dialog class="tenant-dialog" id="tenant-dialog">
        <form method="dialog" id="tenant-form">
          <div class="dialog-heading"><div><div class="eyebrow">SLICE CONFIGURATION</div><h2>Create tenant slice</h2></div><button class="icon-button" value="cancel" aria-label="Close">×</button></div>
          <label>Tenant name<input name="name" required maxlength="26" placeholder="e.g. Tenant E"></label>
          <div class="form-grid">
            <label>Priority<select name="priority"><option value="5">Critical · 5</option><option value="4">High · 4</option><option value="3">Medium · 3</option><option value="2">Standard · 2</option><option value="1">Low · 1</option></select></label>
            <label>Minimum fidelity<input name="fidelity" type="number" min="0.8" max="0.999" step="0.001" value="0.95"></label>
            <label>Source node<select name="source"></select></label>
            <label>Destination node<select name="destination"></select></label>
            <label>Target EDR (ebits/s)<input name="rate" type="number" min="1" max="30" value="5"></label>
            <label>SLA target (%)<input name="sla" type="number" min="90" max="99.99" step="0.1" value="99"></label>
          </div>
          <div class="dialog-actions"><button class="button secondary" value="cancel">Cancel</button><button class="button primary" id="create-tenant" value="default">Create slice <span>→</span></button></div>
        </form>
      </dialog>
    </div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
